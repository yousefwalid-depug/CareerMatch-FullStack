spring.application.name=careermatch-backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/careermatch}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.jackson.property-naming-strategy=SNAKE_CASE

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

careermatch.upload-directory=${CV_UPLOAD_DIRECTORY:uploads/cvs}
careermatch.adzuna.app-id=${ADZUNA_APP_ID:}
careermatch.adzuna.app-key=${ADZUNA_APP_KEY:}
careermatch.cors.allowed-origins=${CAREERMATCH_ALLOWED_ORIGINS:http://localhost:4200}
careermatch.ai.candidate-extraction.provider=${CAREERMATCH_AI_PROVIDER:auto}
careermatch.ai.candidate-extraction.api-key=${OPENAI_API_KEY:}
careermatch.ai.candidate-extraction.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
careermatch.ai.candidate-extraction.model=${OPENAI_MODEL:gpt-4.1-mini}
careermatch.ai.candidate-extraction.temperature=${OPENAI_TEMPERATURE:0}
careermatch.ai.candidate-extraction.max-output-tokens=${OPENAI_MAX_OUTPUT_TOKENS:2500}
careermatch.ai.candidate-extraction.timeout-seconds=${OPENAI_TIMEOUT_SECONDS:12}
careermatch.ai.candidate-extraction.max-input-characters=${OPENAI_MAX_INPUT_CHARACTERS:60000}
